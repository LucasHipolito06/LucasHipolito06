# ---------------------------------------------------------------------------
# Workflow que atualiza as imagens do README do perfil automaticamente.
#
# Ele gera:
#   1. O gráfico 3D de contribuições  -> pasta profile-3d-contrib/
#   2. Os cartões de estatísticas e linguagens (tema claro e escuro) -> pasta profile/
# e depois faz um commit com as imagens novas. O README só aponta para esses
# arquivos, então ele "se atualiza sozinho".
# ---------------------------------------------------------------------------
name: Update profile images

on:
  # Roda todo dia às 06:00 UTC (= 03:00 no horário de Brasília).
  schedule:
    - cron: "0 6 * * *"
  # Cria o botão "Run workflow" na aba Actions para rodar manualmente.
  workflow_dispatch:

# Dá ao token automático (GITHUB_TOKEN) permissão para fazer commit/push
# neste repositório. Sem isso o passo final falharia.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Baixa o repositório para dentro da máquina virtual.
      - uses: actions/checkout@v6

      # 2) Gera o gráfico 3D de contribuições (vários SVGs em profile-3d-contrib/).
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3) Cartões de estatísticas e linguagens: uma versão escura e uma clara.
      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4) Faz commit e push das imagens. Se nada mudou, não faz nada.
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib profile
          git commit -m "chore: update profile images" || exit 0
          git push
